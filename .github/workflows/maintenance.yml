name: Maintenance

# One-off data jobs, run by hand. Without "apply" they only preview (count
# what would change). Prints counts only.
# - migrate-platforms: users' single "platform" becomes the list "platforms".
# - rebuild-stats: rebuilds player stats from every settled match.
# - backfill-image-hashes: adds search pieces to old image fingerprints.
# - migrate-private: moves old matches' lobby code and game IDs to private data.
# - exclude-test-accounts: leaves admin / test accounts out of rankings and
#   Founder numbers (run it BEFORE assign-founders).
# - assign-founders: numbers the first 100 verified players (Founder badge).
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Job to run'
        required: true
        type: choice
        options: [migrate-platforms, rebuild-stats, backfill-image-hashes, migrate-private, exclude-test-accounts, assign-founders]
      apply:
        description: 'Apply the changes (otherwise preview only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci && npm --prefix functions run build
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Run
        env:
          TASK: ${{ inputs.task }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: node functions/lib/scripts/maintenance.js "$TASK" $APPLY
