name: Firebase deploy

# Deploys the backend (Cloud Functions, Firestore rules and indexes, Storage
# rules) to the Firebase project betterplayer-beta.
# Runs on pushes to main that change the backend, or by hand from the Actions
# tab ("Run workflow"). Never on pull requests.
# Uses the repository secret GCP_SA_KEY: the JSON key of the "github-deploy"
# service account. The key is never printed or written into the repo.
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order; never cancel one halfway.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

env:
  PROJECT: betterplayer-beta

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: the functions run on Node 22 and firebase-admin needs >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Cloud Functions dependencies
        run: npm --prefix functions ci

      # Signs in with the key from the secret. The action keeps the key in a
      # temporary file outside the repo and sets GOOGLE_APPLICATION_CREDENTIALS,
      # which the Firebase CLI and gcloud use.
      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Storage rules read Firestore (who is a player / admin). The Firebase CLI
      # only offers to grant this when run by a person, so grant it here.
      # Safe to repeat; a warning (not a failure) if it can't.
      - name: Let Storage rules read Firestore
        run: |
          NUMBER=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
          if ! gcloud projects add-iam-policy-binding "$PROJECT" \
              --member="serviceAccount:service-${NUMBER}@gcp-sa-firebasestorage.iam.gserviceaccount.com" \
              --role="roles/firebaserules.firestoreServiceAgent" \
              --condition=None --quiet > /dev/null; then
            echo "::warning::Couldn't grant Storage access to Firestore. Screenshot uploads may be refused."
          fi

      # --non-interactive: nobody is there to answer questions.
      # --force: set up the cleanup policy for old function builds, and remove
      #          functions that are no longer in the code, without asking.
      - name: Deploy functions, rules and indexes
        run: >
          npx --yes firebase-tools@15 deploy
          --only functions,firestore:rules,firestore:indexes,storage
          --project "$PROJECT" --non-interactive --force
